<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ role|capitalize }} login</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="center"><main class="narrow">
<a href="/" class="muted">Back</a>
<h1>{{ role|capitalize }} login</h1>
{% if err and not signup %}<p class="error">{{ err }}</p>{% endif %}
<form method="post" action="/login/{{ role }}">
  <label>Username <input name="username" required autocomplete="username"></label>
  <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
  <button>Log in</button>
</form>
{% if role in ('customer', 'seller') %}
<details {% if signup %}open{% endif %}><summary>New {{ role }}? Create an account</summary>
{% if err and signup %}<p class="error">{{ err }}</p>{% endif %}
<form method="post" action="/signup/{{ role }}">
  <label>Name <input name="name" required></label>
  <label>Username <input name="username" required autocomplete="username"></label>
  <label>Password (6+ characters) <input name="password" type="password" required minlength="6" autocomplete="new-password"></label>
  <button>Create account</button>
</form></details>
{% endif %}
</main></body></html>
